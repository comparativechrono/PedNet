[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PedNet"
version = "0.1.0"
description = "The mode of inheritance of a family, and how well each candidate variant co-segregates with its condition, from exact pedigree likelihoods"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Hearn", email = "tjh70@cam.ac.uk" }, { name = "Nick Taylor" }]
keywords = ["pedigree", "mode of inheritance", "co-segregation", "segregation analysis", "likelihood ratio",
            "variant classification", "rare disease", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pednet = "pednet.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/PedNet"
Issues = "https://github.com/comparativechrono/PedNet/issues"
Changelog = "https://github.com/comparativechrono/PedNet/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src, so that the tests run on this copy of PedNet without installing it; legacy, for the original modules' tests
pythonpath = ["src", "legacy"]
