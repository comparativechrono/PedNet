[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PedNet"
version = "2.0.0"
description = "Pedigrees as graphs: their structure, kinship and loops, the pattern of affected people, the mode of inheritance, and the co-segregation of candidate variants"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Hearn", email = "tjh70@cam.ac.uk" }, { name = "Nick Taylor" }]
keywords = ["pedigree", "directed acyclic graph", "network analysis", "graph theory", "Bayesian network", "kinship",
            "mode of inheritance", "co-segregation", "variant classification", "rare disease", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21", "networkx>=3.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pednet = "pednet.cli:main"

[project.urls]
Homepage = "https://github.com/comparativechrono/PedNet"
Issues = "https://github.com/comparativechrono/PedNet/issues"
Changelog = "https://github.com/comparativechrono/PedNet/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src, so that the tests run on this copy of PedNet without installing it; legacy, for the original modules' tests
pythonpath = ["src", "legacy"]
