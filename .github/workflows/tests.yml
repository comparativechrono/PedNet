name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PedNet on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest

  legacy:
    name: The original modules, and the benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install pandas networkx matplotlib scikit-learn scipy ".[test]"
      - name: Test the original modules
        run: MPLBACKEND=Agg python -m pytest tests/test_legacy.py
      - name: Run a short benchmark
        run: MPLBACKEND=Agg python benchmarks/benchmark.py --families 5
