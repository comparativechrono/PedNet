name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PedNet on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[test]"
      # -o pythonpath=legacy leaves src off the path, so that the tests run on the installed package
      - name: Test
        run: python -m pytest -o pythonpath=legacy

  legacy:
    name: With the original modules, and the benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install pandas matplotlib scikit-learn scipy ".[test]"
      - name: Test, with the original modules' tests and the comparisons with them
        run: MPLBACKEND=Agg python -m pytest -o pythonpath=legacy
      - name: Train the classifiers and run the benchmark, briefly
        run: |
          python benchmarks/train_classifiers.py --families 20 --out "$RUNNER_TEMP/trained.py"
          python benchmarks/benchmark.py --families 5
