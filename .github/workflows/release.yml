# Publishes PedNet to PyPI.
#
# It uses PyPI's trusted publishing, so no token is stored anywhere: PyPI must be told once that this repository's
# workflow "release.yml", with the environment "pypi", may publish the project PedNet (on PyPI, the project's
# Settings > Publishing; before the first release, your account's Publishing page, as a "pending publisher").
#
# To release: set the new version in pyproject.toml and in src/pednet/__init__.py, add it to CHANGELOG.md, merge, and
# push a tag of the version, such as v0.1.0. Publishing a GitHub release with a new tag of that name does the same.
# The workflow can also be run by hand from the Actions tab, choosing the tag to run it on.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# a tag pushed and a release published for it would start two runs: the second waits, and finds nothing to upload
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          package=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" src/pednet/__init__.py)
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run the release on a tag, such as v$version, not on a branch."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$version" ] || [ "$package" != "$version" ]; then
            echo "::error::The tag ($GITHUB_REF_NAME), pyproject.toml ($version) and pednet.__version__ ($package) must agree."
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install ".[test]"
          python -m pytest -o pythonpath=legacy
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/PedNet/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
